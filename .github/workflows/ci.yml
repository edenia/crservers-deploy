# Checks for this repo itself (not the reusable deploy workflow callers use).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint workflows, scripts and the contact bundle; test the deploy safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

      - name: shellcheck
        run: shellcheck static-site-contact/install-on-server.sh test/run-checks.sh

      - name: Deploy safety checks (fixtures)
        run: bash test/run-checks.sh

      - name: PHP syntax
        run: |
          php -v | head -1
          for f in static-site-contact/*.php; do php -l "$f"; done

      - name: composer validate
        working-directory: static-site-contact
        run: composer validate --no-check-publish
